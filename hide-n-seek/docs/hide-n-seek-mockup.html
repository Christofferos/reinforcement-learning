<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hide & Seek – OpenAI Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Courier New', monospace; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 20px; left: 20px;
    color: #e0e0e0; font-size: 13px; z-index: 10;
    background: rgba(0,0,0,0.5); padding: 14px 18px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    min-width: 180px;
  }
  #ui h2 { font-size: 15px; margin-bottom: 10px; color: #fff; letter-spacing: 1px; }
  .stat { display: flex; justify-content: space-between; gap: 16px; margin: 4px 0; }
  .val { color: #7ec8e3; font-weight: bold; }
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
  }
  button {
    background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    padding: 8px 20px; border-radius: 6px; cursor: pointer; font-family: inherit;
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.2); }
  button.active { background: rgba(126,200,227,0.3); border-color: #7ec8e3; }
  #legend {
    position: fixed; top: 20px; right: 20px;
    color: #e0e0e0; font-size: 12px; z-index: 10;
    background: rgba(0,0,0,0.5); padding: 14px 18px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  }
  #legend h3 { margin-bottom: 8px; font-size: 13px; color: #fff; }
  .leg-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .leg-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  #phase-banner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 32px; font-weight: bold; color: #fff;
    text-shadow: 0 0 20px rgba(126,200,227,0.8);
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity 0.5s;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui">
  <h2>HIDE &amp; SEEK</h2>
  <div class="stat"><span>Episode</span><span class="val" id="ep">1</span></div>
  <div class="stat"><span>Step</span><span class="val" id="step">0</span></div>
  <div class="stat"><span>Phase</span><span class="val" id="phase">PREP</span></div>
  <div class="stat"><span>Hiders reward</span><span class="val" id="hr">0</span></div>
  <div class="stat"><span>Seekers reward</span><span class="val" id="sr">0</span></div>
  <div class="stat"><span>Hiding</span><span class="val" id="hidden">0/2</span></div>
</div>
<div id="legend">
  <h3>AGENTS</h3>
  <div class="leg-item"><div class="leg-dot" style="background:#4fc3f7"></div> Hider</div>
  <div class="leg-item"><div class="leg-dot" style="background:#ef5350"></div> Seeker</div>
  <div class="leg-item"><div class="leg-dot" style="background:#aaa"></div> Box (movable)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#546e7a"></div> Wall (fixed)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#81c784"></div> Ramp</div>
</div>
<div id="phase-banner" id="phase-banner"></div>
<div id="controls">
  <button id="btn-restart">↺ RESTART</button>
  <button id="btn-pause" class="active">⏸ PAUSE</button>
  <button id="btn-speed">SPEED: 1×</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ─────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a3e);
scene.fog = new THREE.Fog(0x2a2a3e, 30, 60);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 22, 22);
camera.lookAt(0, 0, 0);

// ─── Lighting ─────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
scene.add(sun);

// ─── Materials ────────────────────────────────────────────────────────────────
const MAT = {
  floor:  new THREE.MeshLambertMaterial({ color: 0x37474f }),
  wall:   new THREE.MeshLambertMaterial({ color: 0x546e7a }),
  box:    new THREE.MeshLambertMaterial({ color: 0x8d8d8d }),
  ramp:   new THREE.MeshLambertMaterial({ color: 0x81c784 }),
  hider:  new THREE.MeshLambertMaterial({ color: 0x4fc3f7 }),
  seeker: new THREE.MeshLambertMaterial({ color: 0xef5350 }),
  hiderH: new THREE.MeshLambertMaterial({ color: 0x29b6f6, emissive: 0x0d47a1, emissiveIntensity: 0.3 }),
  seekerH:new THREE.MeshLambertMaterial({ color: 0xe53935, emissive: 0xb71c1c, emissiveIntensity: 0.3 }),
};

// ─── Environment ─────────────────────────────────────────────────────────────
const ARENA = 10;

function makeMesh(geo, mat, x, y, z, rx=0, ry=0, rz=0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// Floor
makeMesh(new THREE.BoxGeometry(ARENA*2, 0.3, ARENA*2), MAT.floor, 0, -0.15, 0);

// Outer walls
const wallH = 2.5, wallT = 0.4;
[[0, wallH/2, -ARENA, ARENA*2+wallT, wallH, wallT],
 [0, wallH/2,  ARENA, ARENA*2+wallT, wallH, wallT],
 [-ARENA, wallH/2, 0, wallT, wallH, ARENA*2],
 [ ARENA, wallH/2, 0, wallT, wallH, ARENA*2]
].forEach(([x,y,z,w,h,d]) => makeMesh(new THREE.BoxGeometry(w,h,d), MAT.wall, x,y,z));

// Fixed internal walls (room shape)
const fixedWalls = [
  { x: -3, y: wallH/2, z: 2, w: 4, h: wallH, d: wallT },
  { x:  3, y: wallH/2, z: 2, w: 4, h: wallH, d: wallT },
  { x:  0, y: wallH/2, z: -3, w: wallT, h: wallH, d: 5 },
];
fixedWalls.forEach(({x,y,z,w,h,d}) => makeMesh(new THREE.BoxGeometry(w,h,d), MAT.wall, x,y,z));

// Ramps
makeMesh(new THREE.BoxGeometry(2, 0.2, 3), MAT.ramp, 6, 0.1, 5, -0.15, 0, 0);
makeMesh(new THREE.BoxGeometry(2, 0.2, 3), MAT.ramp, -6, 0.1, -5, -0.15, 0, 0);

// ─── Movable Boxes ────────────────────────────────────────────────────────────
const BOX_SIZE = 1.5;
const boxes = [
  { mesh: null, x: -2, z: 3.5, vx: 0, vz: 0, grabbed: null },
  { mesh: null, x:  2, z: 3.5, vx: 0, vz: 0, grabbed: null },
  { mesh: null, x:  5, z: -4,  vx: 0, vz: 0, grabbed: null },
];
boxes.forEach(b => {
  b.mesh = makeMesh(new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE), MAT.box, b.x, BOX_SIZE/2, b.z);
});

// ─── Agents ───────────────────────────────────────────────────────────────────
const AGENT_R = 0.45, AGENT_H = 0.9;
const agentGeo = new THREE.CylinderGeometry(AGENT_R, AGENT_R, AGENT_H, 12);
const eyeGeo   = new THREE.SphereGeometry(0.1, 6, 6);

function makeAgent(mat, x, z) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(agentGeo, mat);
  body.position.y = AGENT_H/2;
  body.castShadow = true;
  group.add(body);
  // Eyes
  [-0.15, 0.15].forEach(ex => {
    const eye = new THREE.Mesh(eyeGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }));
    eye.position.set(ex, AGENT_H*0.75, AGENT_R*0.85);
    group.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 4),
      new THREE.MeshLambertMaterial({ color: 0x111111 }));
    pupil.position.set(ex, AGENT_H*0.75, AGENT_R*0.95);
    group.add(pupil);
  });
  group.position.set(x, 0, z);
  scene.add(group);
  return group;
}

const hiders = [
  { mesh: makeAgent(MAT.hider, -4, -5), x: -4, z: -5, vx: 0, vz: 0, hidden: false, grabbed: null },
  { mesh: makeAgent(MAT.hider, -5, -4), x: -5, z: -4, vx: 0, vz: 0, hidden: false, grabbed: null },
];
const seekers = [
  { mesh: makeAgent(MAT.seeker,  5, 6), x: 5, z: 6, vx: 0, vz: 0, grabbed: null },
  { mesh: makeAgent(MAT.seeker,  6, 5), x: 6, z: 5, vx: 0, vz: 0, grabbed: null },
];

// ─── Simulation State ─────────────────────────────────────────────────────────
let step = 0, episode = 1;
let paused = true, speed = 1;
const PREP_STEPS  = 80;
const HIDE_STEPS  = 300;
const TOTAL_STEPS = PREP_STEPS + HIDE_STEPS;
let hiderReward = 0, seekerReward = 0;

const banner = document.getElementById('phase-banner');
function showBanner(text) {
  banner.textContent = text;
  banner.style.opacity = '1';
  setTimeout(() => banner.style.opacity = '0', 1200);
}

// ─── Simple Behavior AI ───────────────────────────────────────────────────────
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist2(ax, az, bx, bz) { return Math.hypot(ax-bx, az-bz); }

function steer(agent, tx, tz, speed=0.06) {
  const dx = tx - agent.x, dz = tz - agent.z;
  const d = Math.hypot(dx, dz) || 0.001;
  agent.vx = agent.vx*0.7 + (dx/d)*speed*0.3 + (Math.random()-0.5)*0.01;
  agent.vz = agent.vz*0.7 + (dz/d)*speed*0.3 + (Math.random()-0.5)*0.01;
}

function avoid(agent, others, radius=1.2) {
  others.forEach(o => {
    if (o === agent) return;
    const dx = agent.x - o.x, dz = agent.z - o.z;
    const d = Math.hypot(dx, dz) || 0.001;
    if (d < radius) {
      agent.vx += (dx/d) * 0.04;
      agent.vz += (dz/d) * 0.04;
    }
  });
}

// All solid obstacles: outer walls + internal walls, stored as AABB {minX,maxX,minZ,maxZ}
const solidRects = [
  // Outer walls
  { minX: -ARENA-wallT/2, maxX:  ARENA+wallT/2, minZ: -ARENA-wallT/2, maxZ: -ARENA+wallT/2 },
  { minX: -ARENA-wallT/2, maxX:  ARENA+wallT/2, minZ:  ARENA-wallT/2, maxZ:  ARENA+wallT/2 },
  { minX: -ARENA-wallT/2, maxX: -ARENA+wallT/2, minZ: -ARENA-wallT/2, maxZ:  ARENA+wallT/2 },
  { minX:  ARENA-wallT/2, maxX:  ARENA+wallT/2, minZ: -ARENA-wallT/2, maxZ:  ARENA+wallT/2 },
  // Internal walls: {x,z,w,d} -> AABB
  ...fixedWalls.map(fw => ({
    minX: fw.x - fw.w/2, maxX: fw.x + fw.w/2,
    minZ: fw.z - fw.d/2, maxZ: fw.z + fw.d/2
  }))
];

function resolveWallCollisions(agent, r) {
  // r = collision radius of agent
  for (const rect of solidRects) {
    // Expand rect by agent radius
    const exMinX = rect.minX - r, exMaxX = rect.maxX + r;
    const exMinZ = rect.minZ - r, exMaxZ = rect.maxZ + r;
    if (agent.x > exMinX && agent.x < exMaxX && agent.z > exMinZ && agent.z < exMaxZ) {
      // Find shallowest penetration axis and push out
      const overlapLeft  = agent.x - exMinX;
      const overlapRight = exMaxX - agent.x;
      const overlapFront = agent.z - exMinZ;
      const overlapBack  = exMaxZ - agent.z;
      const minOv = Math.min(overlapLeft, overlapRight, overlapFront, overlapBack);
      if (minOv === overlapLeft)  { agent.x = exMinX; agent.vx = Math.min(agent.vx, 0); }
      else if (minOv === overlapRight) { agent.x = exMaxX; agent.vx = Math.max(agent.vx, 0); }
      else if (minOv === overlapFront) { agent.z = exMinZ; agent.vz = Math.min(agent.vz, 0); }
      else                             { agent.z = exMaxZ; agent.vz = Math.max(agent.vz, 0); }
    }
  }
}

function applyVelocity(agent, r=AGENT_R) {
  const spd = Math.hypot(agent.vx, agent.vz);
  if (spd > 0.12) { agent.vx *= 0.12/spd; agent.vz *= 0.12/spd; }
  agent.x += agent.vx;
  agent.z += agent.vz;
  // Arena boundary clamp
  agent.x = clamp(agent.x, -ARENA+r, ARENA-r);
  agent.z = clamp(agent.z, -ARENA+r, ARENA-r);
  // Wall collision
  resolveWallCollisions(agent, r);
  agent.mesh.position.set(agent.x, 0, agent.z);
  if (spd > 0.01) agent.mesh.rotation.y = Math.atan2(agent.vx, agent.vz);
}

// Hide spots (behind/inside room)
const hideSpots = [
  {x:-1.5, z:0}, {x:0.5, z:0}, {x:-1, z:1}, {x:1, z:-1}
];

function pickHideSpot(idx) { return hideSpots[idx % hideSpots.length]; }

function nearWall(ax, az) {
  for (const fw of fixedWalls) {
    if (Math.abs(ax - fw.x) < fw.w/2 + 0.7 && Math.abs(az - fw.z) < fw.d/2 + 0.7) return true;
  }
  return false;
}

function updateHider(h, idx, phase) {
  if (phase === 'PREP' || phase === 'HIDE') {
    // Move toward hide spot, pulling a box
    const spot = pickHideSpot(idx);
    const nearBox = boxes.find(b => dist2(h.x, h.z, b.x, b.z) < 2.5 && !b.grabbed);
    if (nearBox && dist2(h.x, h.z, spot.x, spot.z) > 2) {
      // Grab and drag box toward entrance
      h.grabbed = nearBox;
      nearBox.grabbed = h;
      steer(h, spot.x, spot.z, 0.05);
    } else {
      if (h.grabbed) { h.grabbed.grabbed = null; h.grabbed = null; }
      steer(h, spot.x + (Math.random()-0.5)*0.5, spot.z + (Math.random()-0.5)*0.5, 0.07);
    }
    avoid(h, [...hiders, ...seekers]);
    applyVelocity(h);

    // Move grabbed box with agent
    if (h.grabbed) {
      h.grabbed.x = h.x + h.vx*3;
      h.grabbed.z = h.z + h.vz*3;
      h.grabbed.mesh.position.set(h.grabbed.x, BOX_SIZE/2, h.grabbed.z);
    }

    h.hidden = nearWall(h.x, h.z) || dist2(h.x, h.z, 0, 0) < 2;
  } else {
    // Freeze / try to stay hidden
    h.vx *= 0.85; h.vz *= 0.85;
    applyVelocity(h);
  }
}

function updateSeeker(s, phase) {
  if (phase === 'PREP') {
    // Wander, locked away
    steer(s, 6 + (Math.random()-0.5)*2, 5 + (Math.random()-0.5)*2, 0.03);
    avoid(s, seekers);
    applyVelocity(s);
  } else {
    // Hunt: move toward nearest visible hider
    let target = null, bestD = Infinity;
    hiders.forEach(h => {
      const d = dist2(s.x, s.z, h.x, h.z);
      if (d < bestD) { bestD = d; target = h; }
    });
    if (target) {
      steer(s, target.x + (Math.random()-0.5)*0.3, target.z + (Math.random()-0.5)*0.3, 0.085);
    } else {
      steer(s, (Math.random()-0.5)*8, (Math.random()-0.5)*8, 0.04);
    }
    // Grab box to place it out of way (emergent)
    const nearBox = boxes.find(b => dist2(s.x, s.z, b.x, b.z) < 2 && !b.grabbed);
    if (nearBox && Math.random() < 0.01) {
      s.grabbed = nearBox; nearBox.grabbed = s;
    }
    if (s.grabbed && Math.random() < 0.02) { s.grabbed.grabbed = null; s.grabbed = null; }
    if (s.grabbed) {
      s.grabbed.x = clamp(s.x + s.vx*4, -8, 8);
      s.grabbed.z = clamp(s.z + s.vz*4, -8, 8);
      s.grabbed.mesh.position.set(s.grabbed.x, BOX_SIZE/2, s.grabbed.z);
    }
    avoid(s, seekers);
    applyVelocity(s);
  }
}

// ─── Reward Computation ───────────────────────────────────────────────────────
function computeRewards(phase) {
  if (phase !== 'SEEK') return;
  let caught = 0;
  hiders.forEach(h => {
    seekers.forEach(s => {
      if (dist2(h.x, h.z, s.x, s.z) < 1.0) caught++;
    });
  });
  if (caught === 0) hiderReward++;
  else seekerReward += caught;
}

// ─── Phase Logic ──────────────────────────────────────────────────────────────
let lastPhase = '';
function getPhase() {
  if (step < PREP_STEPS)  return 'PREP';
  if (step < HIDE_STEPS)  return 'HIDE';
  return 'SEEK';
}

function resetEpisode() {
  step = 0; hiderReward = 0; seekerReward = 0;
  hiders.forEach((h, i) => {
    h.x = -4 - i; h.z = -5 + i*2; h.vx = 0; h.vz = 0; h.hidden = false; h.grabbed = null;
    h.mesh.position.set(h.x, 0, h.z);
    h.mesh.children.forEach(c => { if (c.material) c.material = MAT.hider; });
  });
  seekers.forEach((s, i) => {
    s.x = 5+i; s.z = 6-i*2; s.vx = 0; s.vz = 0; s.grabbed = null;
    s.mesh.position.set(s.x, 0, s.z);
  });
  boxes.forEach((b, i) => {
    const starts = [{x:-2,z:3.5},{x:2,z:3.5},{x:5,z:-4}];
    b.x = starts[i].x; b.z = starts[i].z; b.vx = 0; b.vz = 0; b.grabbed = null;
    b.mesh.position.set(b.x, BOX_SIZE/2, b.z);
  });
  episode++;
  document.getElementById('ep').textContent = episode;
  showBanner('EPISODE ' + episode);
}

// ─── UI Helpers ───────────────────────────────────────────────────────────────
function updateUI(phase) {
  document.getElementById('step').textContent = step;
  document.getElementById('phase').textContent = phase;
  document.getElementById('hr').textContent = hiderReward;
  document.getElementById('sr').textContent = seekerReward;
  const hiddenCount = hiders.filter(h => h.hidden).length;
  document.getElementById('hidden').textContent = `${hiddenCount}/${hiders.length}`;
}

// Agent color flash on phase change
function onPhaseChange(phase) {
  showBanner(phase === 'PREP' ? '⏳ PREP PHASE' : phase === 'HIDE' ? '🏃 HIDE!' : '🔍 SEEK!');
  hiders.forEach(h => {
    h.mesh.children[0].material = (phase === 'SEEK') ? MAT.hiderH : MAT.hider;
  });
  seekers.forEach(s => {
    s.mesh.children[0].material = (phase === 'SEEK') ? MAT.seekerH : MAT.seeker;
  });
}

// ─── Camera Orbit ─────────────────────────────────────────────────────────────
let camAngle = 0;
function orbitCamera(delta) {
  camAngle += delta * 0.0002;
  camera.position.x = Math.sin(camAngle) * 26;
  camera.position.z = Math.cos(camAngle) * 26;
  camera.position.y = 20;
  camera.lookAt(0, 1, 0);
}

// ─── Main Loop ────────────────────────────────────────────────────────────────
let last = performance.now();
let simStep = 0;

function tick(now) {
  requestAnimationFrame(tick);
  const delta = now - last; last = now;

  orbitCamera(delta);

  if (!paused) {
    for (let s = 0; s < speed; s++) {
      const phase = getPhase();
      if (phase !== lastPhase) { onPhaseChange(phase); lastPhase = phase; }

      hiders.forEach((h, i) => updateHider(h, i, phase));
      seekers.forEach(s => updateSeeker(s, phase));
      computeRewards(phase);
      updateUI(phase);
      step++;
      if (step >= TOTAL_STEPS) { resetEpisode(); lastPhase = ''; }
    }
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(tick);

// ─── Controls ────────────────────────────────────────────────────────────────
document.getElementById('btn-pause').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? '▶ PLAY' : '⏸ PAUSE';
  this.classList.toggle('active', !paused);
});
document.getElementById('btn-restart').addEventListener('click', resetEpisode);
document.getElementById('btn-speed').addEventListener('click', function() {
  speed = speed === 1 ? 3 : speed === 3 ? 6 : 1;
  this.textContent = `SPEED: ${speed}×`;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
